name: Monthly SKU Intelligence Report

on:
  schedule:
    # Runs on the first day of every month at 08:00 Bolivia time (UTC-4).
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      refresh_note:
        description: 'Optional note for this manual refresh'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: monthly-sku-intelligence
  cancel-in-progress: false

jobs:
  refresh-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EQUESTRIAN_SHOPIFY_STORE: ${{ secrets.EQUESTRIAN_SHOPIFY_STORE }}
      EQUESTRIAN_SHOPIFY_TOKEN: ${{ secrets.EQUESTRIAN_SHOPIFY_TOKEN }}
      CAVALI_SHOPIFY_STORE: ${{ secrets.CAVALI_SHOPIFY_STORE }}
      CAVALI_SHOPIFY_TOKEN: ${{ secrets.CAVALI_SHOPIFY_TOKEN }}
      SHOPIFY_API_VERSION: '2026-10'
      REPORT_TIMEZONE: 'America/La_Paz'
      DROPSHIP_TAGS: 'dropship,dropshipping'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate both Shopify connections
        run: |
          test -n "$EQUESTRIAN_SHOPIFY_STORE" && test -n "$EQUESTRIAN_SHOPIFY_TOKEN"
          test -n "$CAVALI_SHOPIFY_STORE" && test -n "$CAVALI_SHOPIFY_TOKEN"

      - name: Refresh both stores and archive monthly JSON
        run: npm run refresh

      - name: Commit monthly and annual JSON archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-report.json data/archive/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: archive monthly SKU reports for both stores"
            git push
          fi
